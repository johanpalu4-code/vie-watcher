name: VIE Watcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vie-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install requests

      - name: Verifier les nouvelles offres
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          RUN_ONCE: "1"
        run: python vie_watcher.py

      - name: Sauvegarder les offres deja vues
        run: |
          git config user.name "vie-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_offers.json
          git diff --cached --quiet || (git commit -m "MAJ offres vues" && git push)
